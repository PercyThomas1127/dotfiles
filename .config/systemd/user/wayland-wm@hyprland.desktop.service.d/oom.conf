# Do NOT tear down the whole desktop because one app was OOM-killed.
#
# systemd's default OOMPolicy for a service is `stop`: if ANY process in the
# unit is killed by the kernel OOM killer, systemd stops the entire unit. The
# compositor, every autostart and every app launched from the session live in
# this unit, so a single OOM kill anywhere took the whole session down.
#
# That is exactly what happened on 2026-09-15 19:17:29. RAM was exhausted
# (~8MB free of 7.3GB, 2.03GB unevictable, zswap thrashing in
# zswap_writeback_entry) and the OOM killer picked two VS Code HELPER
# processes -- 32MB and 11MB RSS, which VS Code deliberately marks as first
# victims with oom_score_adj=300. Hyprland itself was never killed: there was
# no coredump and no Hyprland crash report. systemd then stopped the unit, the
# session logged out, and the greeter came up.
#
# With `continue`, the OOM-killed process dies alone and the desktop survives,
# which is the behaviour anyone would expect from a 32MB helper being reaped.
[Service]
OOMPolicy=continue
