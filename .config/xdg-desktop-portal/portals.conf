# Portal backend preferences.
#
# WHY: xdg-desktop-portal-gtk is a GTK3 binary, and GTK3 has no fractional
# scaling support on Wayland. With scale = 1.6 its file dialog sized itself in
# PHYSICAL pixels (2430x1542) while being positioned in LOGICAL coordinates on
# a 1600x1000 screen, so it overflowed every edge -- landing at -415,-241 and
# rendering as an apparently black window with its content off-screen.
#
# xdg-desktop-portal-kde implements the same FileChooser interface but is Qt6
# (libQt6Gui/libQt6Widgets, no GTK3), and Qt6 handles fractional scaling
# correctly. So route only the file chooser there.
#
# Everything else is left alone: hyprland keeps ScreenCast/Screenshot, gtk
# keeps Settings/Print/Notification etc.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=kde
