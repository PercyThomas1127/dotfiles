# HyprWave Configuration File

[General]
# Edge to anchor HyprWave to
# Options: right, left, top, bottom
edge = bottom

# Margin from the screen edge (in pixels)
margin = 10

# Layer to render on
# Options: background, bottom, top, overlay
layer = top

# Exclusive zone: 0 = respect other surfaces, -1 = overlap everything
exclusive_zone = 0

[Notifications]
enabled = true
now_playing = true

[Visualizer]
# Enable/disable visualizer (horizontal layout only)
enabled = true

# Idle timeout in seconds before visualizer appears
# Set to 0 to disable auto-activation
idle_timeout = 5

[VerticalDisplay]
enabled=true
idle_timeout=5

[MusicPlayer]
preference = firefox,spotify,vlc

[RGB]
# Sync OpenRGB lights to the visualizer: every LED takes the bar's colour
# (the album accent), brightness jumps with the music, and the Wraith Prism
# fan ring shows the bars. Talks to openrgb.service's SDK server. While music
# plays, the Effects plugin is paused; ~3s after it stops, the Effects
# startup profile is reloaded.
enabled = true
host = 127.0.0.1
port = 6742
fps = 30
# Lowest brightness while syncing (0..1), and colour saturation (0..1).
floor = 0.15
saturation = 1.0
# Effects profile to restore when music stops. Default: the plugin's
# "Load profile at startup" choice.
#restore_profile = yep
