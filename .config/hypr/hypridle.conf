general {
    # `a || b && c` is left-associative, so the old form ran hyprctl reload in
    # both branches -- immediately when hyprlock was already up, rather than
    # after unlock. The reload was never needed here anyway.
    lock_cmd = pidof hyprlock || hyprlock
    # No hyprctl reload: it re-applies the wildcard hl.monitor({output=""})
    # from hyprland.lua, which undoes whatever the lid handler just did.
    before_sleep_cmd = loginctl lock-session
    # `hyprctl dispatch dpms on` FAILS on this build (exit 7): dispatch builds
    # invalid Lua, `hl.dispatch(dpms on)`. The && then meant hyprctl reload
    # never ran either, so nothing re-enabled the display after a resume.
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({action="on"}))'
}

listener {
    timeout = 300                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 300                                          # 2.5min.
    on-timeout = brightnessctl -sd kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 600                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 630                                                     # 5.5min
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({action="off"}))'   # screen off
    # The broken dispatch also prevented brightnessctl -r from ever running,
    # so brightness was never restored after an idle dim.
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({action="on"}))' ; brightnessctl -r
}

listener {
    timeout = 1200                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
