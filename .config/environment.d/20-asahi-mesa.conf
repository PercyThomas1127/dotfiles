# Stop the random full-screen magenta flashes.
#
# Magenta is the error colour on Apple GPUs: it is what gets displayed when
# something samples an *uninitialized compressed texture*. A couple of frames
# of magenta is the GPU rendering that sentinel before the next correct frame
# arrives. Cosmetic -- nothing is failing -- but startling, which is reason
# enough to turn it off.
#
# This is a known upstream issue, not a local misconfiguration. See
# AsahiLinux/linux#72 (GPU rendering issues tracker), which lists Firefox
# flashing magenta on startup and KWin flashing magenta rectangles. nocompress
# disables compressed textures, so the uninitialized-compressed case cannot
# arise. It is a workaround; when the driver/app bugs are fixed upstream this
# file should be deleted.
#
# Why here and not hl.env() in hyprland.lua: hl.env only sets variables that
# Hyprland exports to programs *it* launches. Hyprland itself is already
# running by then, so its own rendering -- notably the blur, which allocates
# several intermediate buffers per frame -- would not be covered. The systemd
# user manager reads environment.d at login, before the compositor starts.
#
# Cost: uncompressed textures spend more memory bandwidth. Blur passes were
# dropped 3 -> 2 in the same commit to offset it.
#
# Only read at session start: a re-login is required, `hyprctl reload` will
# not pick it up.
ASAHI_MESA_DEBUG=nocompress
