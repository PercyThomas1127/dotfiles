# Make Qt apps use KDE's platform theme (Breeze + the configured colour
# scheme) instead of Qt's built-in Fusion look.
#
# This matters for xdg-desktop-portal-kde, which serves the file-chooser
# dialog. It is D-Bus/systemd activated, NOT launched by Hyprland, so it
# inherits the systemd user environment -- hl.env() in hyprland.lua would
# never reach it. environment.d is read by the systemd user manager at
# login, which is why the setting lives here.
#
# Requires plasma-integration (provides KDEPlasmaPlatformTheme6.so).
# Colour scheme itself comes from ~/.config/kdedefaults/kdeglobals
# (currently ColorScheme=BreezeDark, widgetStyle=Breeze).
QT_QPA_PLATFORMTHEME=kde
